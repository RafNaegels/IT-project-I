<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../styles/oefenpaginas.css">
    <link rel="stylesheet" href="../styles/reactiesnelheid.css">
    <script type="text/javascript" charset="utf-8"
            src="../scripts/reactiesnelheid.js"></script>
    <title>Title</title>
</head>
<body>

    <main>
        <header class="sub-header-advanced">
            <div>
                <span class="label">MODULE 04</span>
                <h2>Reactiesnelheidstest</h2>
            </div>
            <a href="Hoofdpagina.html" class="back-btn">◀ OVERZICHT</a>
        </header>
        <div class="inhoud">
            <div class="oefeningDisplay flex instructie" id="startScherm">
                <div>
                    <h1>
                        Reactiesnelheid
                    </h1>
                    <p>
                        Op het volgende scherm krijgt u een rooster te zien <br>
                        Er zal één voor één een vakje oplichten waarop je moet klikken <br>
                        Probeer dit zo snel mogelijk te doen zonder fout
                    </p>
                </div>
                    <button class="volgendePagina" id="startOefening">start oefening</button>
            </div>

            <div class="oefeningDisplay opgaveReactiesnelheid" id="opgave">
                <div class="wrapper">
                    <div id="rooster" class="rooster">

                    </div> <!--rooster-->
                </div> <!--wrapper-->

                <div class="onderbalkReactiesnelheid" id="onderbalk">
                    <div class="feedback" id="liveFeedback">
                        <p></p> <!--lege paragraaf voor positionering-->
                        <p>aantal fouten: <span id="liveFeedbackFouten">0</span></p>

                        <p>
                            <span id="aantalHits">0</span>
                            <span>/</span>
                            <span id="totaalVakjes">0</span>
                        </p>
                    </div> <!-- feedback -->
                </div> <!-- onderbalk -->
            </div> <!--oefenscherm-->

            <div class="resultaat oefeningDisplay" id="resultaat">
                <h1>Resultaat</h1>
                <div class="resultaatRegel">
                    <span class="resultaatParameter">tijd:</span> <span id="tijdsduur"></span>
                </div>
                <div class="resultaatRegel">
                    <span class="resultaatParameter">aantal fouten:</span> <span class="fout" id="aantalFouten"></span>
                </div>
                <button class="volgendePagina" id="opnieuw">opnieuw</button>
            </div><!--resultaat-->
        </div>
    </main>
</body>
</html>
